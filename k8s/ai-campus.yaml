apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-campus
  template:
    metadata:
      labels:
        app: ai-campus
    spec:
      containers:
        - name: ai-campus
          image: ai-campus-platform:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: ai-campus-env

---
apiVersion: v1
kind: Service
metadata:
  name: ai-campus-service
spec:
  selector:
    app: ai-campus
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000